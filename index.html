<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Mini-Ball Physics Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 15px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 1.2rem;
            color: #38bdf8;
        }
        p {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>Mini-Ball Physics Engine</h1>
        <p>Tap on the screen to spawn balls</p>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth * 0.9;
            canvas.height = window.innerHeight * 0.8;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const gravity = 0.3;
        const damping = 0.98;
        const restitution = 0.75;

        class Ball {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 12 + 10;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.mass = this.radius;
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
            }

            update() {
                this.vy += gravity;
                this.vx *= damping;
                this.vy *= damping;

                this.x += this.vx;
                this.y += this.vy;

                this.resolveBoundaryCollisions();
            }

            resolveBoundaryCollisions() {
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = -this.vx * restitution;
                } else if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx = -this.vx * restitution;
                }

                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy = -this.vy * restitution;
                } else if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy = -this.vy * restitution;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        const balls = [];

        for (let i = 0; i < 15; i++) {
            balls.push(new Ball(canvas.width / 2, canvas.height / 3));
        }

        function resolveInterBallCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    let b1 = balls[i];
                    let b2 = balls[j];

                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let distance = Math.hypot(dx, dy);
                    let minDistance = b1.radius + b2.radius;

                    if (distance < minDistance && distance > 0) {
                        let nx = dx / distance;
                        let ny = dy / distance;

                        let overlap = minDistance - distance;
                        b1.x -= nx * overlap * 0.5;
                        b1.y -= ny * overlap * 0.5;
                        b2.x += nx * overlap * 0.5;
                        b2.y += ny * overlap * 0.5;

                        let kx = b1.vx - b2.vx;
                        let ky = b1.vy - b2.vy;
                        let p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

                        b1.vx -= p * b2.mass * nx;
                        b1.vy -= p * b2.mass * ny;
                        b2.vx += p * b1.mass * nx;
                        b2.vy += p * b1.mass * ny;
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            balls.forEach(ball => {
                ball.update();
            });

            resolveInterBallCollisions();

            balls.forEach(ball => {
                ball.draw();
            });

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            balls.push(new Ball(x, y));
        });

        animate();
    </script>
</body>
</html>
